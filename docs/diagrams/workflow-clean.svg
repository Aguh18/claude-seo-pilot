<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">SEO Pilot Workflow</title>
  <desc id="wf-desc">Flowchart showing 5 SEO Pilot commands: init, write, audit, reaudit, status.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
  </defs>
  <rect width="1120" height="420" fill="#f5f5f5"/>

  <!-- INIT -->
  <rect x="24" y="56" width="160" height="48" rx="6" fill="#2d3142" stroke="none"/>
  <text x="104" y="78" fill="#fff" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">/seo-pilot init</text>
  <text x="104" y="94" fill="rgba(255,255,255,0.5)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Project setup</text>

  <!-- INIT sub-steps -->
  <rect x="24" y="128" width="48" height="32" rx="4" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="48" y="148" fill="#2d3142" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">Scrape</text>
  <rect x="80" y="128" width="48" height="32" rx="4" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="104" y="148" fill="#2d3142" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">Keywords</text>
  <rect x="136" y="128" width="48" height="32" rx="4" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="160" y="148" fill="#2d3142" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">Report</text>

  <!-- WRITE -->
  <path d="M 184,80 H 240" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="240" y="56" width="184" height="48" rx="6" fill="#2d3142" stroke="none"/>
  <text x="332" y="78" fill="#fff" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">/seo-pilot blog-write</text>
  <text x="332" y="94" fill="rgba(255,255,255,0.5)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Full pipeline</text>

