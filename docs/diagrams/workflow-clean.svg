  <text x="332" y="192" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">15+ skills</text>
  <text x="572" y="192" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">10+ skills</text>
  <text x="812" y="192" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">10+ skills (fresh)</text>
  <text x="1020" y="192" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Read-only</text>

  <!-- Output arrows -->
  <path d="M 104,200 V 240" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <path d="M 332,200 V 240" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <path d="M 572,200 V 240" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <path d="M 812,200 V 240" fill="none" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>

  <!-- Output labels -->
  <rect x="4" y="244" width="200" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
  <text x="104" y="262" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">seo-strategy.html</text>
  <text x="104" y="276" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">diagrams/ · research/</text>
  <text x="104" y="290" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">.seo-project.md</text>

  <rect x="220" y="244" width="224" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
  <text x="332" y="262" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">content/*.md</text>
  <text x="332" y="276" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">schema · SEO fixes</text>
  <text x="332" y="290" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">hero-image.png</text>

  <rect x="460" y="244" width="224" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
  <text x="572" y="262" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">reports/audit-domain-date.html</text>
  <text x="572" y="276" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">reports/audit-domain-date.md</text>
  <text x="572" y="290" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">5 individual audit .md files</text>

  <rect x="692" y="244" width="240" height="56" rx="6" fill="rgba(235,108,54,0.04)" stroke="rgba(235,108,54,0.2)" stroke-width="0.8"/>
  <text x="812" y="262" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">reports/audit-domain-YYYY-MM-DD-HHmm.html</text>
  <text x="812" y="276" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">reports/audit-domain-YYYY-MM-DD-HHmm.md</text>
  <text x="812" y="290" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">5 individual audit .md files (fresh)</text>

