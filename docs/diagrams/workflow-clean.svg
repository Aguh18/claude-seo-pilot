  <rect x="536" y="128" width="48" height="32" rx="4" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="560" y="148" fill="#2d3142" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">Page</text>
  <rect x="592" y="128" width="48" height="32" rx="4" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="616" y="148" fill="#2d3142" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">Schema</text>
  <rect x="648" y="128" width="48" height="32" rx="4" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="672" y="148" fill="#2d3142" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">GEO</text>

