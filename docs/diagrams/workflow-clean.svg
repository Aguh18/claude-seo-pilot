<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">SEO Pilot Workflow</title>
  <desc id="wf-desc">Flowchart showing 4 SEO Pilot commands: init, write, audit, status.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- Arrows first -->
  <path d="M 184,80 H 240" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 424,80 H 480" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 664,80 H 720" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- INIT -->
  <rect x="24" y="48" width="160" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="24" y="48" width="160" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="104" y="80" fill="#2d3142" font-size="13" font-weight="600" font-family="sans-serif" text-anchor="middle">init</text>
  <text x="104" y="96" fill="#4f5d75" font-size="9" font-family="monospace" text-anchor="middle">Research + Setup</text>

  <!-- WRITE -->
  <rect x="240" y="48" width="184" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="240" y="48" width="184" height="64" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/>
  <text x="332" y="80" fill="#2d3142" font-size="13" font-weight="600" font-family="sans-serif" text-anchor="middle">write</text>
  <text x="332" y="96" fill="#4f5d75" font-size="9" font-family="monospace" text-anchor="middle">Research - Write - SEO</text>

  <!-- AUDIT -->
  <rect x="480" y="48" width="184" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="480" y="48" width="184" height="64" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/>
  <text x="572" y="80" fill="#2d3142" font-size="13" font-weight="600" font-family="sans-serif" text-anchor="middle">audit</text>
  <text x="572" y="96" fill="#4f5d75" font-size="9" font-family="monospace" text-anchor="middle">Technical + GEO + Report</text>

  <!-- STATUS -->
  <rect x="720" y="48" width="160" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="720" y="48" width="160" height="64" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/>
  <text x="800" y="80" fill="#2d3142" font-size="13" font-weight="600" font-family="sans-serif" text-anchor="middle">status</text>
  <text x="800" y="96" fill="#4f5d75" font-size="9" font-family="monospace" text-anchor="middle">Check Progress</text>

  <!-- INIT sub-steps -->
  <rect x="24" y="144" width="160" height="108" rx="6" fill="#f5f5f5"/>
  <rect x="24" y="144" width="160" height="108" rx="6" fill="rgba(235,108,54,0.03)" stroke="rgba(235,108,54,0.15)" stroke-width="0.8"/>
  <text x="32" y="164" fill="#4f5d75" font-size="8" font-family="monospace" letter-spacing="0.1em">INTERNALLY RUNS</text>
  <rect x="32" y="176" width="144" height="24" rx="4" fill="#fff" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="104" y="192" fill="#2d3142" font-size="9" font-family="sans-serif" text-anchor="middle">defuddle scrape</text>
  <rect x="32" y="204" width="144" height="24" rx="4" fill="#fff" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="104" y="220" fill="#2d3142" font-size="9" font-family="sans-serif" text-anchor="middle">Serper API keywords</text>
  <rect x="32" y="232" width="144" height="24" rx="4" fill="#fff" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="104" y="248" fill="#2d3142" font-size="9" font-family="sans-serif" text-anchor="middle">diagram-design</text>

  <rect x="24" y="264" width="160" height="60" rx="6" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.20)" stroke-width="0.8"/>
  <text x="32" y="280" fill="#eb6c36" font-size="8" font-family="monospace" letter-spacing="0.1em">CREATES</text>
  <text x="104" y="296" fill="#2d3142" font-size="9" font-family="monospace" text-anchor="middle">BRAND.md VOICE.md</text>
  <text x="104" y="308" fill="#2d3142" font-size="9" font-family="monospace" text-anchor="middle">diagrams/ vault/</text>

  <path d="M 104,112 V 144" fill="none" stroke="#eb6c36" stroke-width="1" marker-end="url(#arrow-accent)"/>

  <!-- WRITE sub-steps -->
  <rect x="240" y="144" width="184" height="108" rx="6" fill="#f5f5f5"/>
  <rect x="240" y="144" width="184" height="108" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="248" y="164" fill="#4f5d75" font-size="8" font-family="monospace" letter-spacing="0.1em">INTERNALLY RUNS</text>
  <rect x="248" y="176" width="84" height="24" rx="4" fill="#fff" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="290" y="192" fill="#2d3142" font-size="9" font-family="sans-serif" text-anchor="middle">Research</text>
  <rect x="340" y="176" width="76" height="24" rx="4" fill="#fff" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="378" y="192" fill="#2d3142" font-size="9" font-family="sans-serif" text-anchor="middle">Outline</text>
  <rect x="248" y="204" width="84" height="24" rx="4" fill="#fff" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="290" y="220" fill="#2d3142" font-size="9" font-family="sans-serif" text-anchor="middle">Write</text>
  <rect x="340" y="204" width="76" height="24" rx="4" fill="#fff" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="378" y="220" fill="#2d3142" font-size="9" font-family="sans-serif" text-anchor="middle">SEO Check</text>

  <rect x="240" y="264" width="184" height="60" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="248" y="280" fill="#4f5d75" font-size="8" font-family="monospace" letter-spacing="0.1em">CREATES</text>
  <text x="332" y="296" fill="#2d3142" font-size="9" font-family="monospace" text-anchor="middle">content/*.md + schema</text>
  <text x="332" y="308" fill="#2d3142" font-size="9" font-family="monospace" text-anchor="middle">obsidian-vault/</text>

  <path d="M 332,112 V 144" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- AUDIT sub-steps -->
  <rect x="480" y="144" width="184" height="108" rx="6" fill="#f5f5f5"/>
  <rect x="480" y="144" width="184" height="108" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="488" y="164" fill="#4f5d75" font-size="8" font-family="monospace" letter-spacing="0.1em">INTERNALLY RUNS</text>
  <rect x="488" y="176" width="84" height="24" rx="4" fill="#fff" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="530" y="192" fill="#2d3142" font-size="9" font-family="sans-serif" text-anchor="middle">Technical</text>
  <rect x="580" y="176" width="76" height="24" rx="4" fill="#fff" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="618" y="192" fill="#2d3142" font-size="9" font-family="sans-serif" text-anchor="middle">On-Page</text>
  <rect x="488" y="204" width="84" height="24" rx="4" fill="#fff" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="530" y="220" fill="#2d3142" font-size="9" font-family="sans-serif" text-anchor="middle">Schema</text>
  <rect x="580" y="204" width="76" height="24" rx="4" fill="#fff" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="618" y="220" fill="#2d3142" font-size="9" font-family="sans-serif" text-anchor="middle">GEO</text>

  <rect x="480" y="264" width="184" height="60" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="488" y="280" fill="#4f5d75" font-size="8" font-family="monospace" letter-spacing="0.1em">CREATES</text>
  <text x="572" y="296" fill="#2d3142" font-size="9" font-family="monospace" text-anchor="middle">reports/audit-*.md</text>
  <text x="572" y="308" fill="#2d3142" font-size="9" font-family="monospace" text-anchor="middle">Fix priority list</text>

  <path d="M 572,112 V 144" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- STATUS -->
  <rect x="720" y="144" width="160" height="60" rx="6" fill="#f5f5f5"/>
  <rect x="720" y="144" width="160" height="60" rx="6" fill="#fff" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="800" y="168" fill="#2d3142" font-size="9" font-family="sans-serif" text-anchor="middle">Shows pipeline</text>
  <text x="800" y="182" fill="#2d3142" font-size="9" font-family="sans-serif" text-anchor="middle">progress + next step</text>

  <path d="M 800,112 V 144" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <line x1="24" y1="360" x2="876" y2="360" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="24" y="376" fill="#4f5d75" font-size="8" font-family="monospace" letter-spacing="0.14em">LEGEND</text>
  <rect x="100" y="370" width="80" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/>
  <text x="192" y="378" fill="#4f5d75" font-size="8" font-family="monospace">Init</text>
  <rect x="240" y="370" width="80" height="10" rx="2" fill="#fff" stroke="#2d3142" stroke-width="0.8"/>
  <text x="332" y="378" fill="#4f5d75" font-size="8" font-family="monospace">Core</text>
</svg>