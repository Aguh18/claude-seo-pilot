  <path d="M 904,80 H 960" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="960" y="56" width="120" height="48" rx="6" fill="#2d3142" stroke="none"/>
  <text x="1020" y="78" fill="#fff" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">/seo-pilot status</text>
  <text x="1020" y="94" fill="rgba(255,255,255,0.5)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Pipeline progress</text>

  <!-- STATUS sub-steps -->
  <rect x="960" y="128" width="56" height="32" rx="4" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="988" y="148" fill="#2d3142" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">Phases</text>
  <rect x="1024" y="128" width="56" height="32" rx="4" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="1052" y="148" fill="#2d3142" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">Next</text>

