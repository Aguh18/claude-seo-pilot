<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 960" font-family="'Geist',system-ui,sans-serif" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">SEO Pilot Workflow</title>
  <desc id="wf-desc">Five SEO Pilot commands showing their execution flow, parallel agents, and outputs.</desc>
  <style>svg { color-scheme: light only; }</style>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
  </defs>
  <rect width="880" height="960" fill="#f5f5f5"/>

  <!-- Title -->
  <text x="40" y="40" fill="#2d3142" font-size="18" font-weight="600">SEO Pilot — 5 Commands</text>
  <text x="40" y="58" fill="#7a8399" font-size="10" font-family="'Geist Mono',monospace">Parallel subagents · Multi-skill loading · Wave-based execution</text>

  <!-- ═══ INIT ═══════════════════════════════════════ -->
  <rect x="24" y="80" width="832" height="140" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
  <rect x="24" y="80" width="6" height="140" rx="3" fill="#2d3142"/>

  <text x="44" y="108" fill="#2d3142" font-size="14" font-weight="600">/seo-pilot init</text>
  <text x="200" y="108" fill="#7a8399" font-size="10" font-family="'Geist Mono',monospace">Project setup — research, competitors, strategy, diagrams</text>

  <!-- Wave labels -->
  <text x="44" y="132" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.1em">WAVE 1</text>
  <text x="320" y="132" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.1em">WAVE 2</text>
  <text x="580" y="132" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.1em">WAVE 3</text>

  <!-- Wave 1: 4 parallel -->
  <rect x="44" y="140" width="260" height="64" rx="4" fill="#e8f0fe" stroke="#4a69bd" stroke-width="0.8"/>
  <text x="174" y="158" fill="#4a69bd" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" font-weight="600">4 PARALLEL AGENTS</text>
  <text x="174" y="174" fill="#2d3142" font-size="9" text-anchor="middle">Scrape Site · Competitors · Keywords · Questions</text>
  <text x="174" y="190" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Skills: seo-firecrawl, seo-keyword, blog-discourse</text>

  <text x="314" y="172" fill="#bfc0c0" font-size="14">→</text>

  <!-- Wave 2: report + diagrams -->
  <rect x="332" y="140" width="232" height="64" rx="4" fill="#e8f0fe" stroke="#4a69bd" stroke-width="0.8"/>
  <text x="448" y="158" fill="#4a69bd" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" font-weight="600">2 PARALLEL REPORTS</text>
  <text x="448" y="174" fill="#2d3142" font-size="9" text-anchor="middle">Strategy Report · 3 Diagrams</text>
  <text x="448" y="190" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Skills: diagram-design, dataviz</text>

  <text x="574" y="172" fill="#bfc0c0" font-size="14">→</text>

  <!-- Wave 3: config -->
  <rect x="592" y="140" width="100" height="64" rx="4" fill="#e6f9e6" stroke="#27ae60" stroke-width="0.8"/>
  <text x="642" y="158" fill="#27ae60" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" font-weight="600">CONFIG</text>
  <text x="642" y="174" fill="#2d3142" font-size="9" text-anchor="middle">.seo-project</text>
  <text x="642" y="188" fill="#2d3142" font-size="9" text-anchor="middle">.seo-state</text>

  <!-- Output label -->
  <text x="712" y="152" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">OUTPUT:</text>
  <text x="712" y="166" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace">seo-strategy.html</text>
  <text x="712" y="178" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace">3 diagrams + research</text>
  <text x="712" y="190" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace">.seo-project.md</text>

  <!-- ═══ BLOG-WRITE ═══════════════════════════════ -->
  <rect x="24" y="240" width="832" height="140" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
  <rect x="24" y="240" width="6" height="140" rx="3" fill="#2d3142"/>

  <text x="44" y="268" fill="#2d3142" font-size="14" font-weight="600">/seo-pilot blog-write</text>
  <text x="252" y="268" fill="#7a8399" font-size="10" font-family="'Geist Mono',monospace">Full content pipeline — from keywords to published post</text>

  <text x="44" y="292" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.1em">W1</text>
  <text x="184" y="292" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.1em">W2</text>
  <text x="364" y="292" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.1em">W3</text>
  <text x="484" y="292" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.1em">W4</text>
  <text x="624" y="292" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.1em">W5</text>

  <!-- W1: parallel research -->
  <rect x="44" y="300" width="128" height="64" rx="4" fill="#e8f0fe" stroke="#4a69bd" stroke-width="0.8"/>
  <text x="108" y="318" fill="#4a69bd" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" font-weight="600">PARALLEL</text>
  <text x="108" y="334" fill="#2d3142" font-size="9" text-anchor="middle">Keyword Research</text>
  <text x="108" y="348" fill="#2d3142" font-size="9" text-anchor="middle">Discourse Scan</text>

  <text x="180" y="332" fill="#bfc0c0" font-size="14">→</text>

  <!-- W2: sequential -->
  <rect x="192" y="300" width="160" height="64" rx="4" fill="#fef3e0" stroke="#f39c12" stroke-width="0.8"/>
  <text x="272" y="318" fill="#b8860b" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" font-weight="600">SEQUENTIAL</text>
  <text x="272" y="334" fill="#2d3142" font-size="9" text-anchor="middle">Content Brief</text>
  <text x="272" y="348" fill="#2d3142" font-size="9" text-anchor="middle">Article Outline</text>

  <text x="360" y="332" fill="#bfc0c0" font-size="14">→</text>

  <!-- W3: write -->
  <rect x="372" y="300" width="100" height="64" rx="4" fill="#fef3e0" stroke="#f39c12" stroke-width="0.8"/>
  <text x="422" y="318" fill="#b8860b" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" font-weight="600">WRITE</text>
  <text x="422" y="334" fill="#2d3142" font-size="9" text-anchor="middle">Full Article</text>
  <text x="422" y="348" fill="#2d3142" font-size="9" text-anchor="middle">+ Hero Image</text>

  <text x="480" y="332" fill="#bfc0c0" font-size="14">→</text>

  <!-- W4: seo check -->
  <rect x="492" y="300" width="120" height="64" rx="4" fill="#e8f0fe" stroke="#4a69bd" stroke-width="0.8"/>
  <text x="552" y="318" fill="#4a69bd" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" font-weight="600">PARALLEL</text>
  <text x="552" y="334" fill="#2d3142" font-size="9" text-anchor="middle">SEO Check</text>
  <text x="552" y="348" fill="#2d3142" font-size="9" text-anchor="middle">Schema Gen</text>

  <text x="620" y="332" fill="#bfc0c0" font-size="14">→</text>

  <!-- W5: publish -->
  <rect x="632" y="300" width="100" height="64" rx="4" fill="#e6f9e6" stroke="#27ae60" stroke-width="0.8"/>
  <text x="682" y="318" fill="#27ae60" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" font-weight="600">PUBLISH</text>
  <text x="682" y="334" fill="#2d3142" font-size="9" text-anchor="middle">Assemble</text>
  <text x="682" y="348" fill="#2d3142" font-size="9" text-anchor="middle">+ Save</text>

  <!-- Output -->
  <text x="752" y="312" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">OUTPUT:</text>
  <text x="752" y="326" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace">content/*.md</text>
  <text x="752" y="338" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace">schema + SEO fixes</text>
  <text x="752" y="350" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace">hero-image.png</text>

  <!-- ═══ AUDIT ═══════════════════════════════════════ -->
  <rect x="24" y="400" width="832" height="140" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
  <rect x="24" y="400" width="6" height="140" rx="3" fill="#2e5aa8"/>

  <text x="44" y="428" fill="#2d3142" font-size="14" font-weight="600">/seo-pilot audit</text>
  <text x="208" y="428" fill="#7a8399" font-size="10" font-family="'Geist Mono',monospace">Full SEO audit — 5 parallel agents, combined report</text>

  <text x="44" y="452" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.1em">WAVE 1 — 5 PARALLEL AUDITS</text>

  <!-- 5 audit agents -->
  <rect x="44" y="460" width="148" height="56" rx="4" fill="#e8f0fe" stroke="#4a69bd" stroke-width="0.8"/>
  <text x="118" y="480" fill="#2d3142" font-size="10" font-weight="600" text-anchor="middle">Technical SEO</text>
  <text x="118" y="496" fill="#7a8399" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle">seo-technical, seo-performance</text>

  <rect x="200" y="460" width="148" height="56" rx="4" fill="#e8f0fe" stroke="#4a69bd" stroke-width="0.8"/>
  <text x="274" y="480" fill="#2d3142" font-size="10" font-weight="600" text-anchor="middle">On-Page SEO</text>
  <text x="274" y="496" fill="#7a8399" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle">seo-content, seo-page</text>

  <rect x="356" y="460" width="148" height="56" rx="4" fill="#e8f0fe" stroke="#4a69bd" stroke-width="0.8"/>
  <text x="430" y="480" fill="#2d3142" font-size="10" font-weight="600" text-anchor="middle">Schema</text>
  <text x="430" y="496" fill="#7a8399" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle">seo-schema, blog-schema</text>

  <rect x="512" y="460" width="148" height="56" rx="4" fill="#e8f0fe" stroke="#4a69bd" stroke-width="0.8"/>
  <text x="586" y="480" fill="#2d3142" font-size="10" font-weight="600" text-anchor="middle">GEO / AI Citation</text>
  <text x="586" y="496" fill="#7a8399" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle">seo-geo, seo-flow</text>

  <rect x="668" y="460" width="148" height="56" rx="4" fill="#e8f0fe" stroke="#4a69bd" stroke-width="0.8"/>
  <text x="742" y="480" fill="#2d3142" font-size="10" font-weight="600" text-anchor="middle">Content Quality</text>
  <text x="742" y="496" fill="#7a8399" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle">seo-content, blog-analyze</text>

  <!-- Output -->
  <text x="752" y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">OUTPUT:</text>
  <text x="752" y="432" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace">audit-domain-date.html</text>
  <text x="752" y="444" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace">audit-domain-date.md</text>

  <!-- ═══ REAUDIT ═══════════════════════════════════════ -->
  <rect x="24" y="560" width="832" height="180" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1.5"/>
  <rect x="24" y="560" width="6" height="180" rx="3" fill="#eb6c36"/>

  <text x="44" y="588" fill="#eb6c36" font-size="14" font-weight="600">/seo-pilot reaudit</text>
  <text x="220" y="588" fill="#7a8399" font-size="10" font-family="'Geist Mono',monospace">Clean old files + re-run fresh audit with new timestamp</text>

  <text x="44" y="612" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.1em">PHASE 0</text>
  <text x="232" y="612" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.1em">PHASE 1 — 5 PARALLEL</text>
  <text x="572" y="612" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.1em">PHASE 2</text>

  <!-- Phase 0: clean -->
  <rect x="44" y="620" width="176" height="64" rx="4" fill="#fde8e0" stroke="#eb6c36" stroke-width="1"/>
  <text x="132" y="640" fill="#c0392b" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" font-weight="600">CLEAN</text>
  <text x="132" y="656" fill="#2d3142" font-size="9" text-anchor="middle">Delete old reports</text>
  <text x="132" y="670" fill="#7a8399" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle">rm reports/*.{html,md}</text>

  <text x="228" y="652" fill="#eb6c36" font-size="14">→</text>

  <!-- Phase 1: audit -->
  <rect x="240" y="620" width="320" height="64" rx="4" fill="#e8f0fe" stroke="#4a69bd" stroke-width="0.8"/>
  <text x="400" y="640" fill="#4a69bd" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" font-weight="600">5 PARALLEL AUDITS</text>
  <text x="400" y="656" fill="#2d3142" font-size="9" text-anchor="middle">Technical · On-Page · Schema · GEO · Content</text>
  <text x="400" y="670" fill="#7a8399" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle">Same agents as audit — fresh data</text>

  <text x="568" y="652" fill="#bfc0c0" font-size="14">→</text>

  <!-- Phase 2: timestamped report -->
  <rect x="580" y="620" width="220" height="64" rx="4" fill="#e6f9e6" stroke="#27ae60" stroke-width="1"/>
  <text x="690" y="640" fill="#27ae60" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" font-weight="600">TIMESTAMPED</text>
  <text x="690" y="656" fill="#2d3142" font-size="9" text-anchor="middle">Fresh Report</text>
  <text x="690" y="670" fill="#7a8399" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle">audit-domain-YYYY-MM-DD-HHmm.html</text>

  <!-- Output -->
  <text x="44" y="710" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">OUTPUT:</text>
  <text x="112" y="710" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace">Timestamped reports (new) + 5 individual audit files (fresh)</text>
  <text x="44" y="726" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace">Config, research, content preserved — only old audit files deleted</text>

  <!-- ═══ STATUS ═══════════════════════════════════════ -->
  <rect x="24" y="760" width="832" height="80" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
  <rect x="24" y="760" width="6" height="80" rx="3" fill="#2d3142"/>

  <text x="44" y="788" fill="#2d3142" font-size="14" font-weight="600">/seo-pilot status</text>
  <text x="216" y="788" fill="#7a8399" font-size="10" font-family="'Geist Mono',monospace">Show pipeline progress — what's done, what's next</text>

  <rect x="44" y="800" width="160" height="28" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
  <text x="124" y="818" fill="#2d3142" font-size="9" font-weight="600" text-anchor="middle">Read .seo-state.json</text>

  <text x="216" y="818" fill="#bfc0c0" font-size="14">→</text>

  <rect x="232" y="800" width="160" height="28" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
  <text x="312" y="818" fill="#2d3142" font-size="9" font-weight="600" text-anchor="middle">Scan content/ + research/</text>

  <text x="404" y="818" fill="#bfc0c0" font-size="14">→</text>

  <rect x="420" y="800" width="160" height="28" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
  <text x="500" y="818" fill="#2d3142" font-size="9" font-weight="600" text-anchor="middle">Show progress + next step</text>

  <!-- ═══ LEGEND ═══════════════════════════════════════ -->
  <line x1="24" y1="860" x2="856" y2="860" stroke="#bfc0c0" stroke-width="1"/>
  <text x="24" y="880" fill="#4a69bd" font-size="9" font-family="'Geist Mono',monospace" font-weight="600" letter-spacing="0.1em">LEGEND</text>

  <rect x="108" y="870" width="12" height="12" rx="2" fill="#e8f0fe" stroke="#4a69bd" stroke-width="1"/>
  <text x="126" y="881" fill="#4a69bd" font-size="9" font-weight="600" font-family="'Geist Mono',monospace">Parallel agents</text>

  <rect x="268" y="870" width="12" height="12" rx="2" fill="#fef3e0" stroke="#f39c12" stroke-width="1"/>
  <text x="286" y="881" fill="#b8860b" font-size="9" font-weight="600" font-family="'Geist Mono',monospace">Sequential step</text>

  <rect x="428" y="870" width="12" height="12" rx="2" fill="#e6f9e6" stroke="#27ae60" stroke-width="1"/>
  <text x="446" y="881" fill="#27ae60" font-size="9" font-weight="600" font-family="'Geist Mono',monospace">Config / Publish</text>

  <rect x="588" y="870" width="12" height="12" rx="2" fill="#fde8e0" stroke="#eb6c36" stroke-width="1"/>
  <text x="606" y="881" fill="#c0392b" font-size="9" font-weight="600" font-family="'Geist Mono',monospace">Cleanup (delete old)</text>

  <line x1="768" y1="876" x2="792" y2="876" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="800" y="881" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace">Data flow</text>

  <!-- Accent line -->
  <line x1="24" y1="910" x2="856" y2="910" stroke="#eb6c36" stroke-width="2"/>
  <text x="440" y="930" fill="#eb6c36" font-size="11" font-weight="600" text-anchor="middle">★ reaudit = clean old files + re-run audit with fresh timestamped output ★</text>
</svg>
