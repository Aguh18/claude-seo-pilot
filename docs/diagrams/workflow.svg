  <text x="548" y="196" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">audit-domain-date.html</text>
  <text x="548" y="210" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">audit-domain-date.md</text>
  <text x="548" y="224" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">5 individual audit files</text>
  <text x="548" y="238" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">technical · onpage · schema · geo · content</text>

  <!-- Output: reaudit (accent) -->
  <rect x="664" y="176" width="216" height="68" rx="6" fill="rgba(235,108,54,0.04)" stroke="rgba(235,108,54,0.2)" stroke-width="0.8"/>
  <text x="772" y="196" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">audit-domain-YYYY-MM-DD-HHmm.html</text>
  <text x="772" y="210" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">audit-domain-YYYY-MM-DD-HHmm.md</text>
  <text x="772" y="224" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">5 individual audit files (fresh)</text>
  <text x="772" y="238" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Old files deleted</text>

  <!-- Legend -->
  <line x1="24" y1="260" x2="936" y2="260" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="24" y="276" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>

  <rect x="100" y="268" width="10" height="10" rx="2" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="116" y="277" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace">Parallel</text>

  <rect x="180" y="268" width="10" height="10" rx="2" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="196" y="277" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace">Sequential</text>

  <rect x="280" y="268" width="10" height="10" rx="2" fill="rgba(39,174,96,0.06)" stroke="rgba(39,174,96,0.25)" stroke-width="0.8"/>
  <text x="296" y="277" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace">Single / Publish</text>

  <rect x="410" y="268" width="10" height="10" rx="2" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="0.8"/>
  <text x="426" y="277" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace">Cleanup (delete old)</text>

  <line x1="560" y1="273" x2="580" y2="273" stroke="#4f5d75" stroke-width="1" marker-end="url(#a)"/>
  <text x="588" y="277" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace">Data flow</text>

  <line x1="660" y1="273" x2="680" y2="273" stroke="#eb6c36" stroke-width="1" marker-end="url(#aa)"/>
  <text x="688" y="277" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace">Reaudit flow</text>
</svg>
