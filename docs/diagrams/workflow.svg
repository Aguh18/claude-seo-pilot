<svg viewBox="0 0 960 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="seo-pilot-wf-title seo-pilot-wf-desc">
  <title id="seo-pilot-wf-title">SEO Pilot Workflow</title>
  <desc id="seo-pilot-wf-desc">Four SEO Pilot commands — init, blog-write, audit, reaudit — showing their parallel and sequential execution waves.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
  </defs>

  <rect width="960" height="680" fill="#f5f5f5"/>

  <!-- ═══ INIT ═══════════════════════════════════════ -->
  <text x="40" y="36" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">/seo-pilot init</text>
  <text x="188" y="36" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Full project setup</text>

  <!-- init: wave labels -->
  <text x="140" y="56" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">WAVE 1</text>
  <text x="370" y="56" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">WAVE 2</text>
  <text x="570" y="56" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">WAVE 3</text>

  <!-- init wave 1: 4 parallel boxes -->
  <rect x="60" y="64" width="160" height="56" rx="4" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="140" y="84" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PARALLEL</text>
  <text x="140" y="100" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">4 agents</text>
  <text x="140" y="114" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">scrape · competitors · keywords · questions</text>

  <!-- arrow -->
  <line x1="224" y1="92" x2="288" y2="92" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- init wave 2: report + diagrams -->
  <rect x="296" y="64" width="160" height="56" rx="4" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="376" y="84" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PARALLEL</text>
  <text x="376" y="100" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Report + Diagrams</text>
  <text x="376" y="114" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">strategy.html · 3 diagrams</text>

  <!-- arrow -->
  <line x1="460" y1="92" x2="524" y2="92" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- init wave 3: config -->
  <rect x="532" y="64" width="120" height="56" rx="4" fill="rgba(39,174,96,0.06)" stroke="rgba(39,174,96,0.25)" stroke-width="0.8"/>
  <text x="592" y="84" fill="#27ae60" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SINGLE</text>
  <text x="592" y="100" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Config</text>
  <text x="592" y="114" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">.seo-project.md</text>

  <!-- output label -->
  <text x="680" y="92" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">→ seo-strategy.html + research</text>

  <!-- separator -->
  <line x1="40" y1="136" x2="920" y2="136" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>

  <!-- ═══ BLOG-WRITE ═══════════════════════════════ -->
  <text x="40" y="164" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">/seo-pilot blog-write</text>
  <text x="220" y="164" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Full content pipeline</text>

  <!-- blog-write wave labels -->
  <text x="110" y="184" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">W1</text>
  <text x="260" y="184" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">W2</text>
  <text x="410" y="184" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">W3</text>
  <text x="540" y="184" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">W4</text>
  <text x="680" y="184" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">W5</text>

  <!-- W1: parallel research -->
  <rect x="50" y="192" width="120" height="48" rx="4" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="110" y="210" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PARALLEL</text>
  <text x="110" y="228" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Research</text>

  <line x1="174" y1="216" x2="208" y2="216" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- W2: sequential brief + outline -->
  <rect x="216" y="192" width="120" height="48" rx="4" fill="rgba(243,156,18,0.06)" stroke="rgba(243,156,18,0.25)" stroke-width="0.8"/>
  <text x="276" y="210" fill="#f39c12" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SEQUENTIAL</text>
  <text x="276" y="228" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Brief → Outline</text>

  <line x1="340" y1="216" x2="374" y2="216" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- W3: write -->
  <rect x="382" y="192" width="100" height="48" rx="4" fill="rgba(243,156,18,0.06)" stroke="rgba(243,156,18,0.25)" stroke-width="0.8"/>
  <text x="432" y="210" fill="#f39c12" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SINGLE</text>
  <text x="432" y="228" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Write</text>

  <line x1="486" y1="216" x2="508" y2="216" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- W4: seo + schema -->
  <rect x="516" y="192" width="100" height="48" rx="4" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="566" y="210" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PARALLEL</text>
  <text x="566" y="228" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SEO Check</text>

  <line x1="620" y1="216" x2="644" y2="216" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- W5: publish -->
  <rect x="652" y="192" width="100" height="48" rx="4" fill="rgba(39,174,96,0.06)" stroke="rgba(39,174,96,0.25)" stroke-width="0.8"/>
  <text x="702" y="210" fill="#27ae60" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PUBLISH</text>
  <text x="702" y="228" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Assemble</text>

  <text x="770" y="216" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">→ content/</text>

  <!-- separator -->
  <line x1="40" y1="260" x2="920" y2="260" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>

  <!-- ═══ AUDIT ═══════════════════════════════════════ -->
  <text x="40" y="288" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">/seo-pilot audit</text>
  <text x="188" y="288" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Full SEO audit</text>

  <text x="300" y="308" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">WAVE 1 — 5 PARALLEL</text>

  <!-- 5 audit agents -->
  <rect x="80" y="316" width="140" height="40" rx="4" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="150" y="340" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Technical SEO</text>

  <rect x="232" y="316" width="140" height="40" rx="4" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="302" y="340" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">On-Page SEO</text>

  <rect x="384" y="316" width="140" height="40" rx="4" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="454" y="340" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Schema</text>

  <rect x="536" y="316" width="140" height="40" rx="4" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="606" y="340" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">GEO / AI Citation</text>

  <rect x="688" y="316" width="140" height="40" rx="4" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="758" y="340" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Content Quality</text>

  <!-- arrows down to merge -->
  <line x1="300" y1="360" x2="300" y2="388" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="454" y1="360" x2="454" y2="388" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="606" y1="360" x2="606" y2="388" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- merge: combined report -->
  <rect x="280" y="396" width="320" height="36" rx="4" fill="rgba(39,174,96,0.06)" stroke="rgba(39,174,96,0.25)" stroke-width="0.8"/>
  <text x="440" y="418" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Combined Report → audit-domain-date.html</text>

  <text x="620" y="418" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">+ .md</text>

  <!-- separator -->
  <line x1="40" y1="452" x2="920" y2="452" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>

  <!-- ═══ REAUDIT ═══════════════════════════════════════ -->
  <text x="40" y="480" fill="#eb6c36" font-size="14" font-weight="600" font-family="'Geist', sans-serif">/seo-pilot reaudit</text>
  <text x="204" y="480" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Clean + re-run fresh audit</text>

  <text x="140" y="500" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">PHASE 0</text>
  <text x="370" y="500" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">PHASE 1 — 5 PARALLEL</text>
  <text x="720" y="500" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">PHASE 2</text>

  <!-- Phase 0: clean -->
  <rect x="60" y="508" width="160" height="48" rx="4" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1"/>
  <text x="140" y="526" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLEAN</text>
  <text x="140" y="544" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Delete old files</text>

  <!-- arrow -->
  <line x1="224" y1="532" x2="288" y2="532" stroke="#eb6c36" stroke-width="1" marker-end="url(#arrow-accent)"/>

  <!-- Phase 1: 4 audit agents -->
  <rect x="296" y="508" width="136" height="48" rx="4" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="364" y="532" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Technical + On-page</text>
  <text x="364" y="546" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Schema + GEO</text>

  <!-- arrow -->
  <line x1="436" y1="532" x2="580" y2="532" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Phase 2: fresh report -->
  <rect x="588" y="508" width="220" height="48" rx="4" fill="rgba(39,174,96,0.06)" stroke="rgba(39,174,96,0.25)" stroke-width="0.8"/>
  <text x="698" y="526" fill="#27ae60" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TIMESTAMPED</text>
  <text x="698" y="544" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fresh Report</text>

  <text x="588" y="576" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">audit-domain-YYYY-MM-DD-HHmm.html</text>

  <!-- ═══ LEGEND ═══════════════════════════════════════ -->
  <line x1="40" y1="600" x2="920" y2="600" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="40" y="620" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <!-- parallel -->
  <rect x="120" y="610" width="12" height="12" rx="2" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="138" y="620" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Parallel</text>

  <!-- sequential -->
  <rect x="220" y="610" width="12" height="12" rx="2" fill="rgba(243,156,18,0.06)" stroke="rgba(243,156,18,0.25)" stroke-width="0.8"/>
  <text x="238" y="620" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Sequential</text>

  <!-- single/publish -->
  <rect x="330" y="610" width="12" height="12" rx="2" fill="rgba(39,174,96,0.06)" stroke="rgba(39,174,96,0.25)" stroke-width="0.8"/>
  <text x="348" y="620" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Single / Publish</text>

  <!-- reaudit/clean -->
  <rect x="470" y="610" width="12" height="12" rx="2" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1"/>
  <text x="488" y="620" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Cleanup (delete old)</text>

  <!-- arrow legend -->
  <line x1="640" y1="616" x2="664" y2="616" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="672" y="620" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Data flow</text>

  <line x1="750" y1="616" x2="774" y2="616" stroke="#eb6c36" stroke-width="1" marker-end="url(#arrow-accent)"/>
  <text x="782" y="620" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Reaudit flow</text>

</svg>
