  <text x="772" y="44" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">/seo-pilot reaudit</text>
  <text x="772" y="58" fill="rgba(255,255,255,0.65)" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Clean + re-run fresh</text>

  <!-- reaudit sub -->
  <rect x="688" y="80" width="48" height="28" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/>
  <text x="712" y="98" fill="#eb6c36" font-size="8" font-weight="600" text-anchor="middle">Clean</text>
  <rect x="744" y="80" width="40" height="28" rx="4" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
