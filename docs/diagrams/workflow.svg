<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1100" font-family="'Geist',system-ui,sans-serif" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Freelance Workflow</title>
