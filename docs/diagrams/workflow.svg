  <rect x="608" y="80" width="40" height="28" rx="4" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="628" y="98" fill="#2d3142" font-size="8" text-anchor="middle">GEO</text>

