<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'Geist',system-ui,sans-serif" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">SEO Pilot Workflow</title>
  <desc id="wf-desc">Five SEO Pilot commands showing parallel and sequential execution waves.</desc>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
    <marker id="aa" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
  </defs>
  <rect width="960" height="480" fill="#f5f5f5"/>

  <!-- INIT -->
  <rect x="24" y="24" width="152" height="44" rx="6" fill="#2d3142"/>
  <text x="100" y="44" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">/seo-pilot init</text>
  <text x="100" y="58" fill="rgba(255,255,255,0.5)" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Project setup</text>

  <!-- init sub -->
  <rect x="24" y="80" width="44" height="28" rx="4" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="46" y="98" fill="#2d3142" font-size="8" text-anchor="middle">Keys</text>
  <rect x="76" y="80" width="44" height="28" rx="4" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="98" y="98" fill="#2d3142" font-size="8" text-anchor="middle">Comp</text>
  <rect x="128" y="80" width="44" height="28" rx="4" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="150" y="98" fill="#2d3142" font-size="8" text-anchor="middle">Report</text>

  <!-- arrow init→write -->
  <path d="M176,46H232" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- WRITE -->
  <rect x="232" y="24" width="176" height="44" rx="6" fill="#2d3142"/>
  <text x="320" y="44" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">/seo-pilot blog-write</text>
  <text x="320" y="58" fill="rgba(255,255,255,0.5)" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Full pipeline</text>

  <!-- write sub -->
  <rect x="232" y="80" width="40" height="28" rx="4" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="252" y="98" fill="#2d3142" font-size="8" text-anchor="middle">Keys</text>
  <rect x="280" y="80" width="40" height="28" rx="4" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="300" y="98" fill="#2d3142" font-size="8" text-anchor="middle">Brief</text>
  <rect x="328" y="80" width="40" height="28" rx="4" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="348" y="98" fill="#2d3142" font-size="8" text-anchor="middle">Write</text>
  <rect x="376" y="80" width="40" height="28" rx="4" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="396" y="98" fill="#2d3142" font-size="8" text-anchor="middle">SEO</text>

