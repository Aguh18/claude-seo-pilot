  <text x="100" y="132" fill="#7a8399" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle">12+ skills</text>
  <text x="320" y="132" fill="#7a8399" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle">15+ skills</text>
  <text x="548" y="132" fill="#7a8399" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle">10+ skills</text>
  <text x="772" y="132" fill="#7a8399" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle">10+ skills (fresh)</text>

  <!-- Output arrows -->
  <path d="M100,140V172" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#a)"/>
  <path d="M320,140V172" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#a)"/>
  <path d="M548,140V172" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#a)"/>
  <path d="M772,140V172" fill="none" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#aa)"/>

  <!-- Output: init -->
  <rect x="8" y="176" width="184" height="68" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
  <text x="100" y="196" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">seo-strategy.html</text>
  <text x="100" y="210" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">diagrams/ · research/</text>
  <text x="100" y="224" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">.seo-project.md</text>
  <text x="100" y="238" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">.seo-state.json</text>

  <!-- Output: write -->
  <rect x="208" y="176" width="224" height="52" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
  <text x="320" y="196" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">content/*.md</text>
  <text x="320" y="210" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">schema · SEO fixes · hero-image</text>
  <text x="320" y="222" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Published to site</text>

